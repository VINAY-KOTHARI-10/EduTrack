<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduTrack — Students</title>
  <link rel="stylesheet" href="main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="16" fill="#F97316"/><path d="M9 12h14M9 16h10M9 20h12" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span class="brand-name">EduTrack</span>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item" data-page="dashboard"><span class="nav-icon">⬡</span><span>Dashboard</span></a>
        <a href="students.html" class="nav-item active" data-page="students"><span class="nav-icon">◈</span><span>Students</span></a>
        <a href="attendance.html" class="nav-item" data-page="attendance"><span class="nav-icon">◉</span><span>Attendance</span></a>
        <a href="feedback.html" class="nav-item" data-page="feedback"><span class="nav-icon">◎</span><span>Feedback</span></a>
        <a href="reports.html" class="nav-item" data-page="reports"><span class="nav-icon">▣</span><span>Reports</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-badge">
          <div class="user-avatar">A</div>
          <div><div class="user-name">Admin</div><div class="user-role">Faculty Portal</div></div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="topbar-left">
          <h1 class="page-title">Students</h1>
          <p class="page-subtitle">Manage student records</p>
        </div>
        <div class="topbar-right">
          <button class="btn-primary" id="addStudentBtn">+ Add Student</button>
        </div>
      </header>

      <div class="content-area">
        <!-- Filters -->
        <div class="filter-bar">
          <input type="text" class="filter-input" id="searchStudents" placeholder="Search by name or roll no..." />
          <select class="filter-select" id="filterClass">
            <option value="">All Classes</option>
            <option value="CS-A">CS-A</option>
            <option value="CS-B">CS-B</option>
            <option value="CS-C">CS-C</option>
          </select>
        </div>

        <!-- Table -->
        <div class="table-panel">
          <div class="table-wrapper">
            <table class="data-table" id="studentsTable">
              <thead>
                <tr>
                  <th>Roll No.</th>
                  <th>Student Name</th>
                  <th>Class</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Attendance %</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="studentsTableBody">
                <tr><td colspan="7" class="table-loading"><div class="loading-dots"><span></span><span></span><span></span></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Student Modal -->
  <div class="modal-overlay" id="addStudentModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Add New Student</h2>
        <button class="modal-close" id="closeModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="studentName" placeholder="e.g. Aanya Sharma" />
          </div>
          <div class="form-group">
            <label>Roll Number *</label>
            <input type="text" id="studentRoll" placeholder="e.g. CS2021009" />
          </div>
          <div class="form-group">
            <label>Class *</label>
            <select id="studentClass">
              <option value="CS-A">CS-A</option>
              <option value="CS-B">CS-B</option>
              <option value="CS-C">CS-C</option>
            </select>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="studentEmail" placeholder="student@edu.in" />
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="studentPhone" placeholder="9876543210" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn-primary" id="saveStudentBtn">Save Student</button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="students.js"></script>
</body>
</html>
