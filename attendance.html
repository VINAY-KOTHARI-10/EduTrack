<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduTrack — Attendance</title>
  <link rel="stylesheet" href="main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="16" fill="#F97316"/><path d="M9 12h14M9 16h10M9 20h12" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span class="brand-name">EduTrack</span>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">⬡</span><span>Dashboard</span></a>
        <a href="students.html" class="nav-item"><span class="nav-icon">◈</span><span>Students</span></a>
        <a href="attendance.html" class="nav-item active"><span class="nav-icon">◉</span><span>Attendance</span></a>
        <a href="feedback.html" class="nav-item"><span class="nav-icon">◎</span><span>Feedback</span></a>
        <a href="reports.html" class="nav-item"><span class="nav-icon">▣</span><span>Reports</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-badge">
          <div class="user-avatar">A</div>
          <div><div class="user-name">Admin</div><div class="user-role">Faculty Portal</div></div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="topbar-left">
          <h1 class="page-title">Attendance</h1>
          <p class="page-subtitle">Mark and track student attendance</p>
        </div>
      </header>

      <div class="content-area">
        <!-- Mark Attendance Panel -->
        <div class="attendance-controls panel">
          <div class="panel-header">
            <h2 class="panel-title">Mark Attendance</h2>
          </div>
          <div class="att-control-row">
            <div class="form-group">
              <label>Date</label>
              <input type="date" id="attDate" />
            </div>
            <div class="form-group">
              <label>Subject</label>
              <select id="attSubject">
                <option value="">Select Subject</option>
              </select>
            </div>
            <div class="form-group">
              <label>Class</label>
              <select id="attClass">
                <option value="">Select Class</option>
                <option value="CS-A">CS-A</option>
                <option value="CS-B">CS-B</option>
                <option value="CS-C">CS-C</option>
              </select>
            </div>
            <button class="btn-primary" id="loadStudentsBtn">Load Students</button>
          </div>
        </div>

        <!-- Attendance Sheet -->
        <div class="panel" id="attendanceSheetPanel" style="display:none">
          <div class="panel-header">
            <h2 class="panel-title" id="sheetTitle">Attendance Sheet</h2>
            <div class="bulk-actions">
              <button class="btn-ghost" id="markAllPresent">✓ All Present</button>
              <button class="btn-ghost" id="markAllAbsent">✗ All Absent</button>
            </div>
          </div>

          <div class="attendance-legend">
            <span class="legend-item present">● Present</span>
            <span class="legend-item absent">● Absent</span>
            <span class="legend-item late">● Late</span>
          </div>

          <div id="attendanceSheet" class="attendance-grid"></div>

          <div class="att-summary" id="attSummary"></div>
          <div class="panel-footer">
            <button class="btn-primary large" id="saveAttendanceBtn">Save Attendance</button>
          </div>
        </div>

        <!-- History Panel -->
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">Attendance History</h2>
            <select id="historyStudent" class="filter-select small">
              <option value="">All Students</option>
            </select>
          </div>
          <div class="table-wrapper">
            <table class="data-table" id="historyTable">
              <thead>
                <tr><th>Date</th><th>Student</th><th>Subject</th><th>Status</th><th>Marked At</th></tr>
              </thead>
              <tbody id="historyTableBody">
                <tr><td colspan="5" class="table-loading"><div class="loading-dots"><span></span><span></span><span></span></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="api.js"></script>
  <script src="attendance.js"></script>
</body>
</html>
